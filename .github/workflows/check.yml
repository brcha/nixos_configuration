name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Whether anything other than documentation (*.md, doc/) changed. The builds below are skipped
  # by `if:` rather than by path filters, because a skipped job still satisfies a required check
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            # The checkout is the merge commit; its first parent is the base it was merged onto
            pull_request) range=(HEAD^1 HEAD) ;;
            push) range=("$BEFORE" HEAD) ;;
            *) range=() ;;
          esac
          code=true
          if [ ${#range[@]} -gt 0 ] && files=$(git diff --name-only "${range[@]}") && [ -n "$files" ]; then
            echo "$files"
            grep -qvE '\.md$|^doc/' <<<"$files" || code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Formatting, evaluation tests, evaluation of every configuration (the Darwin home included)
  # and the WSL home build
  flake-check:
    needs: changes
    # Runs unless only documentation changed, and also when `changes` failed
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - run: nix flake check -L

  # The Darwin home, built for real
  platform-macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      # Keep going, so one run reports every package that fails to build on macOS
      - run: nix build --no-link -L --keep-going .#legacyPackages.x86_64-linux.platformHomes.darwin

  # The VM tests rebuild their VM closures without a binary cache, so they only run on demand
  vmtest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Allow the runner user to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix build --no-link -L .#vmTests.ssh
