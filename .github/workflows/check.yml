name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # What the change can affect. The builds below are skipped by `if:` rather than by path filters,
  # because a skipped job still satisfies a required check.
  # - code: something the flake reads changed (anything outside `unread`, the documentation and tool-only files)
  # - darwin: something that can change the Darwin home changed (anything outside `unread` and
  #   `linux`). Every file matching `linux` must keep its whole configuration behind a switch that
  #   common-darwin leaves off, or behind pkgs.stdenv.isLinux; otherwise take it out of the pattern
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      darwin: ${{ steps.diff.outputs.darwin }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            # The checkout is the merge commit; its first parent is the base it was merged onto
            pull_request) range=(HEAD^1 HEAD) ;;
            push) range=("$BEFORE" HEAD) ;;
            *) range=() ;;
          esac
          unread='\.md$|^doc/|^(justfile|scripts/update-flake|\.envrc|\.gitignore|\.gitattributes|\.sops\.yaml|LICENSE)$'
          linux='^home/apps/(hyprland[^/]*\.nix|weather\.jq|kde\.nix)$|^home/apps/quickshell/|^home/tools/(razer\.nix|blackwidow-colours\.(nix|sh)|hardware\.nix)$|^os/|^machines/|^tests/(lib\.nix|vm-ssh\.nix)$|^tests/fixtures/'
          code=true
          darwin=true
          if [ ${#range[@]} -gt 0 ] && files=$(git diff --name-only "${range[@]}") && [ -n "$files" ]; then
            echo "$files"
            grep -qvE "$unread" <<<"$files" || code=false
            grep -qvE "$unread|$linux" <<<"$files" || darwin=false
          fi
          printf 'code=%s\ndarwin=%s\n' "$code" "$darwin" | tee -a "$GITHUB_OUTPUT"

  # Formatting, evaluation tests, evaluation of every configuration (the Darwin home included)
  # and the WSL home build
  flake-check:
    needs: changes
    # Runs unless only files the flake does not read changed, and also when `changes` failed
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - run: nix flake check -L

  # The Darwin home, built for real
  platform-macos:
    needs: changes
    # Skipped when only `unread` or `linux` files changed; flake-check still evaluates the Darwin home
    if: ${{ !cancelled() && needs.changes.outputs.darwin != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      # Keep going, so one run reports every package that fails to build on macOS
      - run: nix build --no-link -L --keep-going .#legacyPackages.x86_64-linux.platformHomes.darwin

  # The VM tests rebuild their VM closures without a binary cache, so they only run on demand
  vmtest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Allow the runner user to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix build --no-link -L .#vmTests.ssh
